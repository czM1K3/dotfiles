[appearance]
anim_curve_enter = 'OutCubic'
anim_curve_exit = 'InCubic'
anim_curve_transition = 'Bezier'
anim_duration = 200
anim_duration_fast = 100
anim_duration_slow = 350
animations_enabled = false
radius_large = 12
radius_medium = 8
radius_small = 4
transparency_enabled = true
transparency_level = 1.0

[bookmarks]
paths = [ '~/Documents', '~/Documents/Programming' ]

[context_menu]

[general]
auto_refresh_icons = true
builtin_terminal = true
dark_theme = 'catppuccin-mocha'
default_view = 'grid'
dependency_startup_check = false
font_family = 'FiraCode Nerd Font Mono Med'
grid_fixed_columns = false
hidden_last = false
icon_theme = 'Papirus-Dark'
light_theme = 'catppuccin-latte'
remember_sort_per_folder = true
right_click_to_edit_path = true
show_hidden = true
single_click_opens_folders = false
sort_ascending = true
sort_by = 'name'
split_orientation = 'vertical'
theme = 'michal'

[list_view]
column_widths = { modified = 140, size = 110, type = 80 }
columns = [ 'name', 'size', 'modified', 'type' ]

[miller_view]
current_fraction = 0.5
parent_fraction = 0.20000000000000001

[shortcuts]

[sidebar]
auto_hide_width = 700
hidden_quick_access = [ 'Recents' ]
position = 'left'
visible = true
width = 221

[terminal]
cursor_blink = true
cursor_style = 'block'
font_family = 'FiraCode Nerd Font'
font_size = 12.0
ligatures = true
scrollback_lines = 10000

[window]
button_layout = ':minimize,maximize,close'
show_controls = false